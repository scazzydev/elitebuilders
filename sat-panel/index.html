<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SAT Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #eef3ea; --bg2: #e1ebd8;
    --card: #ffffff; --ink: #171a16; --muted: #7b8677; --line: #e5e9e1; --soft: #f2f5ef;
    --lime: #b8f06a; --lime2: #9be04a; --lime-soft: #edf8dc; --lime-ink: #2f4a12; --on-lime: #22370b;
    --amber: #f2bf4b; --coral: #ef8571; --coral-soft: #fde9e5; --coral-ink: #a8402f;
    --c-purple: #eee9fb; --c-blue: #e5eefb; --c-orange: #fdebe0; --c-mint: #e3f4e8;
    --i-purple: #7457d0; --i-blue: #3a77dc; --i-orange: #df7238; --i-mint: #2c9a58;
    --hero: #171a16; --on-hero: #f4f7f1; --hero-soft: rgba(255,255,255,.09); --hero-muted: rgba(244,247,241,.62);
    --nav-bg: rgba(255,255,255,.88); --nav-on: #171a16; --nav-on-fg: #fff;
    --shadow: 0 10px 30px rgba(28,40,18,.10);
    --r: 26px;
    --display: "Bricolage Grotesque", "Manrope", sans-serif;
    --top: calc(14px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bot: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom));
  }
  :root[data-theme="dark"] {
    --bg1: #0e110d; --bg2: #131811;
    --card: #1a1e18; --ink: #eef3e9; --muted: #8b9587; --line: #2a3027; --soft: #222820;
    --lime-soft: #24321a; --lime-ink: #d6f5a3;
    --coral-soft: #3a2420; --coral-ink: #f7b0a2;
    --c-purple: #2a2540; --c-blue: #1f2c40; --c-orange: #3b2a20; --c-mint: #1e3326;
    --i-purple: #b6a3f5; --i-blue: #8fb6f5; --i-orange: #f3a679; --i-mint: #7fd6a0;
    --hero: #252c21; --hero-soft: rgba(255,255,255,.07);
    --nav-bg: rgba(31,36,28,.9); --nav-on: #b8f06a; --nav-on-fg: #1c2a0c;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--bg1), var(--bg2)) fixed; min-height: 100vh;
    padding: var(--top) 16px calc(112px + var(--bot));
    -webkit-user-select: none; user-select: none; font-variant-numeric: tabular-nums;
  }
  input, textarea, button { font-family: inherit; color: inherit; }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--lime2); outline-offset: 2px; }
  .ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .view { display: none; }
  .view.on { display: block; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- top + countdown ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 6px; }
  .pill { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 4px 14px 4px 4px; font-weight: 700; font-size: 14px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--lime); color: var(--on-lime); display: grid; place-items: center; font-weight: 800; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .flame { color: var(--i-orange); }
  .count { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 16px; }
  .count-n { font-family: var(--display); font-weight: 800; font-size: 96px; line-height: .84; letter-spacing: -4px; }
  .count-l { font-size: 15px; line-height: 1.25; font-weight: 700; color: var(--muted); padding-bottom: 6px; }
  .count-l b { color: var(--ink); font-weight: 800; font-variant-numeric: normal; }

  /* ---------- the "now" card ---------- */
  .now { position: relative; overflow: hidden; background: linear-gradient(155deg, #e6fdb9 0%, var(--lime) 52%, #a3e256 100%); color: var(--on-lime); border-radius: 30px; padding: 18px 18px 16px; margin-bottom: 12px; box-shadow: 0 14px 34px rgba(110,170,40,.22); }
  .now::before { content: ""; position: absolute; width: 240px; height: 240px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.6), rgba(255,255,255,0) 70%); pointer-events: none; }
  .now > * { position: relative; }
  .now-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .now-tag { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.62); padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; }
  .now-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--on-lime); box-shadow: 0 0 0 4px rgba(34,55,11,.14); animation: pulse 1.8s ease-in-out infinite; }
  .now-tag.idle i { animation: none; opacity: .45; box-shadow: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(34,55,11,0); } }
  .now-time { display: block; font-size: 13px; font-weight: 700; opacity: .7; margin: 8px 0 0 2px; }
  .ring { position: relative; width: 58px; height: 58px; flex: none; }
  .ring svg { width: 58px; height: 58px; display: block; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; letter-spacing: -.2px; }
  .now-main { display: flex; gap: 14px; align-items: center; margin: 14px 0 0; }
  .now-emo { width: 58px; height: 58px; border-radius: 20px; background: rgba(255,255,255,.7); display: grid; place-items: center; font-size: 28px; flex: none; }
  .now h2 { font-family: var(--display); font-size: 26px; line-height: 1.08; letter-spacing: -.6px; margin: 0; font-weight: 700; }
  .now-topic { font-size: 14px; font-weight: 600; opacity: .72; margin-top: 4px; line-height: 1.35; }
  .now-cta { margin-top: 18px; }
  .now .btn.go { background: #1c2a0c; color: #f3ffe0; height: 56px; width: 100%; border-radius: 18px; font-size: 15.5px; box-sizing: border-box; }
  .steps { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.45); font-size: 13.5px; line-height: 1.35; font-weight: 600; }
  .step .tm { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 12.5px; opacity: .7; padding-top: 1px; }
  .step.past { opacity: .45; text-decoration: line-through; text-decoration-thickness: 1px; }
  .step.cur { background: #1c2a0c; color: #f3ffe0; }
  .step.cur .tm { opacity: .85; }
  .step-cd { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
  .step-cd b { font-family: var(--display); font-size: 34px; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .step-cd span { font-size: 12px; opacity: .75; font-weight: 700; }
  .now-note { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .75; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .now-note b { font-weight: 800; }

  /* ---------- tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .tile { all: unset; position: relative; background: var(--card); border-radius: 22px; padding: 14px 10px 13px; text-align: center; cursor: pointer; transition: transform .12s; }
  .tile:active { transform: scale(.97); }
  .tile span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile span.lbl { display: block; font-size: 13px; font-weight: 800; margin-bottom: 1px; color: var(--ink); }
  .tile.hl { background: var(--lime); }
  .tile.hl .chip { background: rgba(255,255,255,.55); color: var(--on-lime); }
  .tile.hl span { color: var(--on-lime); opacity: .8; }
  .tile.hl span.lbl { opacity: 1; }
  .badge { position: absolute; top: 8px; right: 10px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .chip { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 8px; flex: none; }
  .purple, .blue, .orange, .mint { background: var(--soft); color: var(--ink); }
  .row .chip, .mx-head .chip { background: var(--card) !important; }
  .limechip { background: var(--lime-soft); color: var(--lime-ink); }

  .hs { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; }
  .hs-txt { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; line-height: 1.35; }
  .hs-txt b { display: block; font-size: 14px; color: var(--ink); font-weight: 800; }

  /* ---------- goal ---------- */
  .goal { background: radial-gradient(120% 140% at 0% 0%, #dcfcab 0%, var(--lime) 48%, var(--lime2) 100%); border-radius: var(--r); padding: 16px; margin-bottom: 12px; color: var(--on-lime); }
  .goal-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .goal h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .goal p { margin: 3px 0 0; font-size: 13px; font-weight: 600; opacity: .85; }
  .goal .big { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -1px; }
  .meter { margin-top: 12px; height: 12px; border-radius: 99px; background: rgba(255,255,255,.55); position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--on-lime); transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .miles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .miles span { background: rgba(255,255,255,.55); border-radius: 99px; padding: 6px 10px; font-size: 12px; font-weight: 800; }
  .miles span b { font-weight: 600; opacity: .7; margin-right: 4px; }
  .meter-l { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; margin-top: 6px; opacity: .75; }

  /* ---------- cards ---------- */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
  .card[hidden] { display: none; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-h h3 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -.2px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 700; }
  .lead { color: var(--muted); font-size: 13px; margin: 4px 0 12px; font-weight: 600; line-height: 1.45; }
  .vtitle { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .vtitle h2 { margin: 0; font-family: var(--display); font-size: 32px; letter-spacing: -1px; font-weight: 800; }
  .vtitle .sub { color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 2px; }
  .roundbtn { all: unset; width: 48px; height: 48px; border-radius: 50%; background: var(--card); display: grid; place-items: center; cursor: pointer; }
  .roundbtn.sm { width: 40px; height: 40px; }
  .roundbtn.lime { background: var(--lime); color: var(--on-lime); }

  /* ---------- timeline ---------- */
  .tl { margin-top: 10px; }
  .tl-row { display: grid; grid-template-columns: 44px 18px 1fr auto; align-items: center; gap: 8px; min-height: 50px; position: relative; }
  .tl-time { font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .tl-dot { width: 18px; height: 18px; display: grid; place-items: center; position: relative; align-self: stretch; }
  .tl-dot::before { content: ""; position: absolute; top: 0; bottom: 0; left: 8px; width: 2px; background: var(--line); }
  .tl-row:first-child .tl-dot::before { top: 50%; }
  .tl-row:last-child .tl-dot::before { bottom: 50%; }
  .tl-dot i { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2.5px var(--line); align-self: center; margin-top: auto; margin-bottom: auto; }
  .tl-row.done .tl-dot i { background: var(--lime2); box-shadow: none; }
  .tl-row.skip .tl-dot i { background: var(--coral); box-shadow: none; }
  .tl-row.miss .tl-dot i { box-shadow: inset 0 0 0 2.5px var(--muted); }
  .tl-row.cur .tl-t { font-weight: 800; }
  .tl-row.cur .tl-dot i { width: 14px; height: 14px; background: var(--ink); box-shadow: 0 0 0 4px var(--lime); }
  .tl-main { min-width: 0; padding: 8px 0; }
  .tl-t { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-s { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tl-row.future .tl-t { color: var(--muted); }
  .tl-row.done .tl-t, .tl-row.miss .tl-t { color: var(--muted); }
  .tl-st { font-size: 12px; font-weight: 800; }
  .tl-st.ok { color: var(--i-mint); }
  .tl-st.bad { color: var(--coral-ink); }
  .tl-st.dim { color: var(--muted); }
  .more { all: unset; display: block; width: 100%; text-align: center; padding: 12px 0 2px; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; }

  /* ---------- rows ---------- */
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 18px; background: var(--soft); margin-top: 8px; }
  .row .chip { margin: 0; width: 36px; height: 36px; border-radius: 12px; font-size: 17px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--ink); color: var(--card); margin-left: 6px; vertical-align: 1px; }
  .tag.lime { background: var(--lime); color: var(--on-lime); }
  .tag.soft { background: var(--line); color: var(--muted); }
  .mini { height: 5px; border-radius: 9px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; border-radius: 9px; }
  .v { font-size: 13px; font-weight: 800; }
  .grp { font-size: 13px; font-weight: 800; color: var(--muted); margin: 18px 2px 2px; }
  .brow { padding: 11px 2px 10px; border-top: 1px solid var(--line); }
  .brow:first-child { border-top: 0; }
  .brow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14.5px; font-weight: 700; }
  .brow-top b { font-weight: 800; }
  .brow-s { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .brow .mini { height: 6px; margin-top: 8px; }
  .score-row { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 10px; }
  .score { font-family: var(--display); font-weight: 800; font-size: 46px; letter-spacing: -1.5px; line-height: 1; }
  .score-l { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.35; }
  .miles span { background: var(--soft) !important; }
  .miles span.hit { background: var(--lime) !important; color: var(--on-lime); }
  .acc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .acc div { background: var(--soft); border-radius: 18px; padding: 12px 14px; }
  .acc b { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .acc span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .daytxt { display: flex; justify-content: space-between; }

  /* mistakes: expandable */
  .mx { background: var(--soft); border-radius: 18px; margin-top: 8px; overflow: hidden; }
  .mx-head { all: unset; display: flex; align-items: center; gap: 12px; padding: 11px 12px; width: 100%; box-sizing: border-box; cursor: pointer; }
  .mx-head .chip { margin: 0; width: 36px; height: 36px; border-radius: 12px; }
  .stage { display: flex; gap: 3px; flex: none; }
  .stage i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .stage i.on { background: var(--lime2); }
  .mx-body { padding: 0 14px 14px; font-size: 14px; line-height: 1.45; font-weight: 600; -webkit-user-select: text; user-select: text; }
  .mx-body .q { margin: 0 0 10px; }
  .mx-meta { font-size: 12.5px; color: var(--muted); font-weight: 700; margin: 10px 0 12px; }

  /* ---------- buttons ---------- */
  .btn { all: unset; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: transform .12s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn.dark { background: var(--ink); color: var(--card); }
  .btn.lime { background: var(--lime); color: var(--on-lime); }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .btn.soft { background: var(--soft); color: var(--ink); }
  .btn.line { box-shadow: inset 0 0 0 2px var(--line); color: var(--ink); }
  .btn.big { height: 54px; width: 100%; font-size: 15.5px; border-radius: 18px; box-sizing: border-box; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .state { font-size: 12px; font-weight: 800; padding: 7px 10px; border-radius: 99px; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
  .rev-strip { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; box-sizing: border-box; background: var(--hero); color: var(--on-hero); border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .rev-strip[hidden] { display: none; }
  .rev-strip span { background: var(--lime); color: var(--on-lime); padding: 8px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; }

  /* ---------- charts ---------- */
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { fill: var(--muted); font-size: 10px; font-family: inherit; font-weight: 700; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 8px; }
  .legend[hidden] { display: none; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .empty { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 18px; padding: 14px; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 8px; line-height: 1.4; }
  .empty b { color: var(--ink); }
  .opp { background: var(--lime-soft); color: var(--lime-ink); border-radius: 18px; padding: 12px 14px; font-size: 14px; font-weight: 600; line-height: 1.4; margin-top: 4px; }
  .opp b { color: var(--ink); }

  /* ---------- quiz ---------- */
  .seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { all: unset; flex: 1; text-align: center; height: 42px; line-height: 42px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; }
  .seg button.on { background: var(--ink); color: var(--card); }
  .seg.small button { height: 36px; line-height: 36px; font-size: 13px; }
  .seg.inset { background: var(--soft); }
  .qdots { display: flex; gap: 5px; flex-wrap: wrap; margin: 12px 2px; min-height: 8px; }
  .qdots i { width: 8px; height: 8px; border-radius: 50%; }
  .q-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .q-meta .tag { margin: 0; }
  .q-text { font-size: 17px; line-height: 1.5; font-weight: 600; margin: 0 0 14px; -webkit-user-select: text; user-select: text; }
  .opt { all: unset; display: flex; gap: 12px; align-items: center; padding: 13px 12px; border-radius: 18px; background: var(--soft); margin-top: 8px; font-size: 15px; font-weight: 600; line-height: 1.35; cursor: pointer; width: 100%; box-sizing: border-box; box-shadow: inset 0 0 0 2px transparent; transition: transform .12s; }
  .opt:active { transform: scale(.99); }
  .opt .L { width: 32px; height: 32px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
  .opt.right { background: var(--lime-soft); box-shadow: inset 0 0 0 2px var(--lime2); }
  .opt.right .L { background: var(--lime); color: var(--on-lime); }
  .opt.wrong { background: var(--coral-soft); box-shadow: inset 0 0 0 2px var(--coral); }
  .opt.wrong .L { background: var(--coral); color: #fff; }
  .opt.locked { pointer-events: none; }

  /* ---------- vocabulary ---------- */
  .vhero { position: relative; overflow: hidden; background: linear-gradient(155deg, #e6fdb9 0%, var(--lime) 52%, #a3e256 100%); color: var(--on-lime); border-radius: 30px; padding: 18px; margin: 14px 0 12px; box-shadow: 0 14px 34px rgba(110,170,40,.22); }

  .vh-set { font-size: 22px !important; line-height: 1.15; }
  .vset { all: unset; background: var(--soft); border-radius: 18px; padding: 11px 12px; cursor: pointer; transition: transform .12s; }
  .vset:active { transform: scale(.98); }
  .vset .vs-h { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; }
  .vset .vs-s { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 3px; }
  .vset.next { background: var(--lime-soft); box-shadow: inset 0 0 0 2px var(--lime2); }
  .vset .mini i { background: var(--lime2); }
  .vset.full { background: var(--lime); color: var(--on-lime); }
  .vset.full .vs-s { color: var(--on-lime); opacity: .75; }

  .vset.full .mini i { background: var(--on-lime); }

  .vs-top { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
  .vs-top .xbtn { background: var(--card); width: 40px; height: 40px; }
  .vs-bar { flex: 1; display: flex; gap: 5px; }
  .vs-bar i { flex: 1; height: 7px; border-radius: 9px; background: var(--card); transition: background .25s; }
  .vs-bar i.ok { background: var(--lime2); }
  .vs-bar i.no { background: var(--coral); }
  .vs-bar i.cur { background: var(--ink); }
  .vs-l { font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }

  .fc { perspective: 1400px; height: min(360px, 52vh); margin-bottom: 14px; cursor: pointer; }
  .fc-in { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .fc.flip .fc-in { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; overflow: hidden; }
  .fc-front { background: linear-gradient(155deg, #e6fdb9 0%, var(--lime) 55%, #a3e256 100%); color: var(--on-lime); box-shadow: 0 16px 36px rgba(110,170,40,.25); }
  .fc-front::before { content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -100px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.65), rgba(255,255,255,0) 70%); }
  .fc-back { background: var(--hero); color: var(--on-hero); transform: rotateY(180deg); box-shadow: var(--shadow); }
  .fc-face > * { position: relative; }
  .fc-pos { align-self: flex-start; background: rgba(255,255,255,.62); padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 800; }
  .fc-back .fc-pos { background: var(--hero-soft); color: var(--hero-muted); }
  .fc-mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .fc-word { font-family: var(--display); font-size: clamp(36px, 11vw, 50px); font-weight: 800; letter-spacing: -1.5px; line-height: 1; word-break: break-word; }
  .fc-alt { font-size: 15px; font-weight: 700; opacity: .65; margin-top: 10px; }
  .fc-tap { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 800; opacity: .6; }
  .fc-uz { font-family: var(--display); font-size: clamp(28px, 8.5vw, 38px); font-weight: 700; letter-spacing: -.8px; line-height: 1.1; }
  .fc-more { font-size: 15px; font-weight: 600; color: var(--hero-muted); margin-top: 10px; line-height: 1.4; }
  .fc-ant { background: var(--hero-soft); border-radius: 18px; padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--hero-muted); line-height: 1.35; }
  .fc-ant span { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 2px; }
  .fc-ant b { color: var(--on-hero); font-weight: 800; }
  .fc-hint { margin-top: 10px; background: rgba(184,240,106,.14); color: var(--lime); border-radius: 14px; padding: 9px 12px; font-size: 13.5px; font-weight: 700; }
  .enter { animation: cardIn .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes cardIn { from { opacity: 0; transform: translateX(26px) scale(.98); } to { opacity: 1; transform: none; } }
  .vq { background: linear-gradient(155deg, #e6fdb9 0%, var(--lime) 55%, #a3e256 100%); color: var(--on-lime); border-radius: 30px; padding: 18px 20px 20px; margin-bottom: 4px; }
  .vq .fc-word { font-size: clamp(32px, 10vw, 44px); margin-top: 14px; }
  .vq-ask { font-size: 13.5px; font-weight: 700; opacity: .7; margin-top: 8px; }
  .vq-res { margin-top: 12px; background: var(--card); border-radius: 22px; padding: 14px 16px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.45; }
  .vq-res b { color: var(--ink); font-weight: 800; }
  .vq-res .vq-v { font-family: var(--display); font-size: 21px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }

  .vsum { text-align: center; padding: 8px 0 0; }
  .vsum .emo { font-size: 46px; line-height: 1; }
  .vsum h2 { font-family: var(--display); font-size: 30px; letter-spacing: -.8px; margin: 12px 0 4px; font-weight: 800; }
  .vsum .sub { font-size: 14px; color: var(--muted); font-weight: 700; }
  .vsum-t { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 10px; }
  .vsum-t div { border-radius: 24px; padding: 16px 10px; }
  .vsum-t b { display: block; font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .vsum-t span { font-size: 13px; font-weight: 800; }
  .vsum-t .ok { background: var(--lime); color: var(--on-lime); }
  .vsum-t .no { background: var(--coral-soft); color: var(--coral-ink); }
  .vsum-left { background: var(--card); border-radius: 20px; padding: 13px 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
  .vsum-left span { color: var(--muted); }
  .vsum-w { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 16px; }
  .vsum-w span { padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; background: var(--card); }
  .vsum-w span.ok { background: var(--lime-soft); color: var(--lime-ink); }
  .vsum-w span.no { background: var(--coral-soft); color: var(--coral-ink); }
  .vsum .grid2 { gap: 8px; margin-bottom: 8px; }

  /* ---------- forms + sheets ---------- */
  label.f { display: block; font-size: 12.5px; font-weight: 800; color: var(--muted); margin: 14px 2px 6px; }
  .inp { width: 100%; box-sizing: border-box; border: 2px solid transparent; background: var(--soft); border-radius: 16px; padding: 13px 14px; font-size: 16px; font-weight: 600; color: var(--ink); outline: none; -webkit-user-select: text; user-select: text; transition: border-color .15s, background .15s; }
  .inp::placeholder { color: var(--muted); opacity: .8; }
  .inp:focus { border-color: var(--lime2); background: var(--card); }
  textarea.inp { resize: none; min-height: 76px; line-height: 1.4; }
  .bignum { font-family: var(--display); font-size: 44px; text-align: center; font-weight: 800; letter-spacing: -1px; }
  .qnum { font-family: var(--display); font-size: 26px; font-weight: 800; text-align: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { all: unset; font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 99px; background: var(--soft); cursor: pointer; transition: background .15s, color .15s; }
  .chips button.on { background: var(--ink); color: var(--card); }
  .scrim { position: fixed; inset: 0; background: rgba(12,16,10,.42); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { visibility: hidden; position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 30px 30px 0 0; padding: 10px 18px 0; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility .32s; z-index: 21; max-height: 92vh; overflow: auto; overscroll-behavior: contain; }
  .sheet.on { transform: none; visibility: visible; }
  .sheet::after { content: ""; display: block; height: calc(18px + var(--bot)); }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
  .sh-x { all: unset; position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .sheet h3 { margin: 4px 44px 4px 0; font-family: var(--display); font-size: 24px; letter-spacing: -.5px; font-weight: 700; }
  .sh-foot { position: sticky; bottom: 0; padding: 14px 0 calc(6px + var(--bot)); margin-bottom: calc(-18px - var(--bot)); background: linear-gradient(to bottom, transparent, var(--card) 22%); z-index: 2; }
  .sh-foot .btn + .btn { margin-top: 8px; }
  .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .ans div { background: var(--soft); border-radius: 16px; padding: 10px 12px; }
  .ans div:last-child { background: var(--lime-soft); }
  .ans span { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted); }
  .ans b { font-size: 16px; }
  .note-box { margin-top: 10px; padding: 12px 14px; border-radius: 16px; background: var(--soft); font-size: 14px; line-height: 1.45; font-weight: 600; }
  .rv-topic { font-family: var(--display); font-size: 21px; font-weight: 700; margin: 8px 0 10px; letter-spacing: -.3px; }
  .xbtn { all: unset; width: 32px; height: 32px; border-radius: 50%; background: var(--card); display: grid; place-items: center; cursor: pointer; font-weight: 800; color: var(--muted); flex: none; }

  /* materials */
  details.mat { background: var(--soft); border-radius: 18px; margin-top: 8px; overflow: hidden; }
  details.mat summary { list-style: none; display: flex; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer; }
  details.mat summary::-webkit-details-marker { display: none; }
  details.mat summary .chip { margin: 0; width: 36px; height: 36px; border-radius: 12px; background: var(--card); }
  details.mat summary .txt { flex: 1; min-width: 0; }
  details.mat summary .t { font-weight: 800; font-size: 15px; }
  details.mat summary .s { font-size: 12px; color: var(--muted); font-weight: 600; }
  details.mat summary .arr { transition: transform .2s; color: var(--muted); }
  details.mat[open] summary .arr { transform: rotate(90deg); }
  details.mat .body { padding: 0 14px 14px; font-size: 14.5px; line-height: 1.6; font-weight: 500; -webkit-user-select: text; user-select: text; }
  details.mat .body b { font-weight: 800; }
  details.mat .body code { background: var(--card); border-radius: 6px; padding: 1px 5px; font-size: 13.5px; }
  details.mat.lesson { background: var(--lime-soft); }

  .toast { position: fixed; left: 50%; top: calc(var(--top) + 4px); transform: translate(-50%, -16px); opacity: 0; visibility: hidden; background: var(--ink); color: var(--card); padding: 11px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility .25s; z-index: 30; white-space: nowrap; box-shadow: var(--shadow); }
  .toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--bot)); display: flex; gap: 4px; background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 6px; border-radius: 999px; box-shadow: var(--shadow); z-index: 10; }
  .nav button { all: unset; position: relative; display: flex; align-items: center; gap: 6px; height: 46px; min-width: 46px; justify-content: center; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: 14px; color: var(--ink); transition: background .2s, padding .2s; }
  .nav button span { display: none; }
  .nav button.on { background: var(--nav-on); color: var(--nav-on-fg); padding: 0 17px 0 15px; }
  .nav button.on span { display: inline; }
  .nav .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--nav-bg); }
  .nav button.on .dot { display: none; }

  /* loading skeleton */
  #msg { padding-top: 6px; }
  .sk { background: linear-gradient(90deg, var(--card) 0%, var(--soft) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.3s linear infinite; border-radius: 22px; margin-bottom: 12px; opacity: .8; }
  @keyframes sh { to { background-position: -200% 0; } }
  .err { background: var(--card); border-radius: var(--r); padding: 22px; font-weight: 700; color: var(--muted); line-height: 1.5; text-align: center; margin-top: 30vh; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="msg">
  <div class="sk" style="width:150px;height:40px;border-radius:99px"></div>
  <div class="sk" style="width:60%;height:84px"></div>
  <div class="sk" style="height:220px;border-radius:30px"></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div>
</div>

<div id="app" hidden>
  <!-- ===== HOME ===== -->
  <section class="view on" id="v-home">
    <div class="top">

    </div>
  </section>

  <!-- ===== QUIZ ===== -->

    <div class="seg" id="qSeg"><button class="on" data-s="math">Math</button><button data-s="rw">R&amp;W</button><button data-s="vocab">So'zlar<span class="cnt" id="vCnt" hidden></span></button></div>
    <div class="qdots" id="qDots"></div>
    <div class="card" id="qCard"></div>
    <div id="vocab" hidden></div>
  </section>

  <!-- ===== MISTAKES ===== -->

    <div class="vtitle"><div><h2>Daftar</h2><div class="sub" id="bSub">—</div></div>
      <button class="roundbtn lime" data-sheet="mistake" aria-label="Xato qo'shish"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <button class="rev-strip" id="bRev" data-sheet="review" hidden><span style="background:none;padding:0;color:inherit;font-weight:700" id="bRevT"></span><span>Boshlash</span></button>

      <div class="seg small inset" id="bSeg" style="margin-top:12px"><button class="on" data-s="all">Hammasi</button><button data-s="math">Math</button><button data-s="rw">R&amp;W</button></div>

      <div id="testList"></div>

const fmt = (d) => { const x = new Date(t(d)); return x.getUTCDate() + "." + String(x.getUTCMonth() + 1).padStart(2, "0"); };
const toMin = (k) => +k.slice(0, 2) * 60 + +k.slice(2, 4);
const hmMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);

const blockEnd = (b) => { const t = (b.time || "").split("–")[1]; return t ? hmMin(t) : toMin(b.key) + 30; };
const fmtLeft = (s) => { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function stepsHtml(b) {
  const steps = b.steps || [];
  if (!steps.length) return "";

  const ci = steps.findIndex((x) => now >= hmMin(x.a) * 60 && now < hmMin(x.b) * 60);
  const rows = steps.map((x, i) => `<div class="step ${i === ci ? "cur" : now >= hmMin(x.b) * 60 ? "past" : ""}"><span class="tm">${x.a}–${x.b}</span><span>${esc(x.what)}${i === ci ? `<div class="step-cd"><b id="stepCd" data-end="${hmMin(x.b) * 60}">${fmtLeft(hmMin(x.b) * 60 - now)}</b><span>qoldi · ${hmMin(x.b) - hmMin(x.a)} daq</span></div>` : ""}</span></div>`).join("");
  return `<div class="steps">${rows}</div>`;
}
let timerStep = null;

const C = { ink: "#171a16", grid: "#e5e9e1", plan: "#c7ccc3", lime: "#9be04a", limeSoft: "#b8f06a", amber: "#f2bf4b", coral: "#ef8571", rest: "#eef1eb", card: "#fff" };

};
const REASON = { qoida: "Qoidani bilmadim", shoshildim: "Shoshildim", tushunmadim: "Savolni tushunmadim", soz: "So'zni bilmadim", vaqt: "Vaqt yetmadi" };

/* ---------- data ---------- */
async function api(payload = {}) {
  const r = await fetch(FN_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData, ...payload }) });
  if (r.status === 403) throw new Error("forbidden");
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}
// an action that returns fresh data: re-render everything
async function act(payload, okText) {
  try {
    const d = await api(payload);
    if (d.result && d.result.error) { toast(d.result.error); haptic("bad"); renderAll(); return false; }
    D = d; renderAll(); if (okText) toast(okText); haptic("ok"); return d.result || true;
  } catch (e) { toast("Internet yo'q — qayta urinib ko'ring"); haptic("bad"); renderAll(); return false; }
}
async function refresh() { try { D = await api(); renderAll(); } catch (e) {} }

/* ---------- charts ---------- */
function lineChart(el, { start, end, ymin, ymax, ticks, series, hlines = [], pct = false, w = 340, h = 190 }) {
  const L = 34, R = 10, T = 14, B = 24;
  const x = (d) => L + ((t(d) - t(start)) / Math.max(1, t(end) - t(start))) * (w - L - R);
  const y = (v) => T + (1 - (v - ymin) / (ymax - ymin)) * (h - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
  for (const v of ticks) s += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="${C.grid}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}${pct ? "%" : ""}</text>`;
  for (let i = 0; i <= 4; i++) {
    const d = new Date(t(start) + ((t(end) - t(start)) * i) / 4).toISOString().slice(0, 10);
    s += `<text x="${x(d)}" y="${h - 6}" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${fmt(d)}</text>`;
  }
  for (const hl of hlines) s += `<line x1="${L}" x2="${w - R}" y1="${y(hl.v)}" y2="${y(hl.v)}" stroke="${hl.color}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  for (const sr of series) {
    if (!sr.points.length) continue;
    const pts = sr.points.map((p) => [x(p[0]), y(p[1])]);
    if (sr.area) s += `<defs><linearGradient id="g${sr.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${sr.color}" stop-opacity=".18"/><stop offset="1" stop-color="${sr.color}" stop-opacity="0"/></linearGradient></defs><path d="M${pts[0][0]},${y(ymin)} L${pts.map((p) => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${y(ymin)} Z" fill="url(#g${sr.id})"/>`;
    s += `<polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${sr.color}" stroke-width="${sr.width || 2.5}" stroke-dasharray="${sr.dash || ""}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (sr.dots) sr.points.forEach((p, i) => {
      const [cx, cy] = pts[i];
      s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${C.card}" stroke="${sr.color}" stroke-width="2.5"/>`;
      if (sr.labels) { const a = cx < L + 16 ? "start" : cx > w - R - 16 ? "end" : "middle"; s += `<text x="${cx}" y="${cy - 10}" text-anchor="${a}" style="fill:${C.ink};font-size:11px;font-weight:800">${p[1]}</text>`; }
    });
  }
  el.innerHTML = s + "</svg>";
}

    return `<details class="mat ${m.kind === "lesson" ? "lesson" : ""}"><summary><div class="chip">${icon}</div>

const WAKE = "0500", WAKE_DL = 5 * 60 + 15, VOCAB_KEYS = ["0630", "1840"];
const vocabLine = () => { const s = vsum(); return [s.due ? `${s.due} ta takror` : "", s.next_set ? `yangi ${vLabel(s.next_set)}` : ""].filter(Boolean).join(" + ") || "Lug'at"; };

// progress ring: blocks started today
function ring(done, total, label) {
  const r = 23, c = 2 * Math.PI * r, p = total ? Math.min(1, done / total) : 0;
  return `<div class="ring" title="Bugun boshlangan bloklar"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="rgba(34,55,11,.14)" stroke-width="5.5"/>
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="#22370b" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 29 29)"/></svg><span>${label || `${done}/${total}`}</span></div>`;
}

// the single most important thing right now
function renderNow() {
  const d = D, bl = d.blocks || [], p = d.plans.find((x) => x.day === d.today);
  let ci = -1; bl.forEach((b, i) => { if (toMin(b.key) <= d.now_min) ci = i; });
  const cur = bl[ci], nxt = bl.find((b) => toMin(b.key) > d.now_min);
  const done = bl.filter((b) => b.status === "done").length, goal = Math.max(1, Math.ceil(bl.length * 0.75));
  const inMin = (b) => { const m = toMin(b.key) - d.now_min, h = Math.floor(m / 60), mm = m % 60; return h ? `${h} soat${mm ? " " + mm + " daqiqa" : ""}dan keyin` : `${m} daqiqadan keyin`; };
  const topic = (b) => blockTopic(p, b.key);
  const head = (tag, idle, time) => `<div class="now-head"><div><span class="now-tag ${idle ? "idle" : ""}"><i></i>${tag}</span>${time ? `<span class="now-time">${esc(time)}</span>` : ""}</div>${bl.length ? ring(done, bl.length) : ""}</div>`;
  const main = (emo, title, sub) => `<div class="now-main"><div class="now-emo">${emo}</div><div><h2>${esc(title)}</h2>${sub ? `<div class="now-topic">${esc(sub)}</div>` : ""}</div></div>`;
  let h;
  if (!bl.length) {
    const tm = d.plans.find((x) => x.day !== d.today);
    const isTest = tm && (tm.kind === "test" || tm.kind === "exam");
    const title = !tm ? "Dam oling" : tm.kind === "test" ? (tm.math || "Practice test") : tm.kind === "exam" ? "SAT kuni" : (tm.math || KIND[tm.kind] || "Ertangi reja");
    const sub = (p && p.evening) || (tm ? [KIND[tm.kind], tm.grammar].filter(Boolean).join(": ") : "Ertaga yangi kun.");
    h = head("Ertaga", true, isTest ? "08:00 da boshlanadi" : "") + main(isTest ? "📝" : "🌱", title, sub)
      + `<div class="now-cta"><button class="btn go" data-go="v-quiz">Savol yechib isinish</button></div>`;
  } else if (cur && !cur.status && cur.key === WAKE) {
    const late = d.now_min > WAKE_DL;
    h = head(late ? "Kechikdingiz" : "Uyg'onish", false, late ? "05:15 o'tdi" : "05:15 gacha") + main("☀️", "Turdingizmi?", topic(cur))
      + `<div class="now-cta"><button class="btn go" data-mark="${cur.key}">☀️ Turdim</button></div>`
      + `<div class="now-note">${late ? "Bugun streak hisoblanmaydi — lekin kunni boshlang" : "05:15 gacha bosilmasa, streak uziladi"}</div>`;
  } else if (cur && !cur.status) {
    const vocabBlock = VOCAB_KEYS.includes(cur.key);
    h = head("Hozir", false, cur.time) + main(cur.emoji, cur.title, topic(cur) || (vocabBlock ? vocabLine() : ""))
      + stepsHtml(cur)
      + `<div class="now-cta"><button class="btn go" data-mark="${cur.key}">${vocabBlock ? "Boshladim — so'zlarga" : "Boshladim"}</button></div>`
      + (nxt ? `<div class="now-note">Keyin <b>${nxt.time.slice(0, 5)} ${esc(nxt.title)}</b></div>` : "");
  } else if (cur && cur.status === "done" && d.now_min < blockEnd(cur) && (cur.steps || []).length && !VOCAB_KEYS.includes(cur.key)) {
    h = head("Hozir", false, cur.time) + main(cur.emoji, cur.title, topic(cur)) + stepsHtml(cur)
      + (nxt ? `<div class="now-note">Keyin <b>${nxt.time.slice(0, 5)} ${esc(nxt.title)}</b></div>` : "");
  } else if (cur && cur.status === "done" && VOCAB_KEYS.includes(cur.key) && vsum().due + (vsum().next_set ? 1 : 0) > 0) {
    h = head("Hozir", false, cur.time) + main(cur.emoji, cur.title, vocabLine())
      + `<div class="now-cta"><button class="btn go" data-go="v-quiz" data-vocab="1">So'zlarni ochish</button></div>`
      + (nxt ? `<div class="now-note">Keyin <b>${nxt.time.slice(0, 5)} ${esc(nxt.title)}</b></div>` : "");
  } else if (nxt) {
    h = head("Keyingi", true, inMin(nxt)) + main(nxt.emoji, nxt.title, [nxt.time, topic(nxt)].filter(Boolean).join(" — "))
      + (cur && cur.status === "done" ? `<div class="now-note">${ICON.check} <b>${esc(cur.title)}</b> boshlandi</div>` : "");
  } else {
    h = head("Kun tugadi", true, "") + main("🌙", `${done} / ${bl.length} blok`, done >= goal ? "Bugungi maqsad bajarildi, streak saqlandi." : `Streak uchun ${goal} ta kerak edi.`)
      + (d.today_work ? "" : `<div class="now-cta"><button class="btn go" data-sheet="report">Kechki hisobni kiritish</button></div>`);
  }

/* ---------- VOCABULARY (flashcards + spaced review) ---------- */
const V_STEPS = 5, V_BATCH = 5;
const V = { words: null, sets: null, today: null, loading: false, mode: null, set: null, queue: [], batch: [], i: 0, res: {}, view: "card", flipped: false, picked: null, opts: {}, passWrong: new Set(), total: 0 };
const vById = (id) => V.words.find((w) => w.id === id);
const shuffle = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
const vDue = () => (V.words || []).filter((w) => w.seen && w.next_review && w.next_review <= V.today);
// set list comes from the server; counts of sets whose words are loaded are recomputed live
function vsum() {
  const base = (D && D.vocab) || { total: 0, seen: 0, due: 0, mastered: 0, next_set: null, sets: [] };
  if (!V.words) return base;
  const sets = new Map((V.sets || base.sets).map((x) => [x.set_no, { ...x }]));
  const live = new Map();
  for (const w of V.words) {
    const a = live.get(w.set_no) || { n: 0, seen: 0, known: 0, mastered: 0 };
    a.n++; if (w.seen) a.seen++; if (w.stage >= 1) a.known++; if (w.stage >= V_STEPS) a.mastered++;
    live.set(w.set_no, a);
  }
  for (const [k, a] of live) sets.set(k, { ...(sets.get(k) || { set_no: k, label: "Set " + k }), ...a });
  const list = [...sets.values()].sort((a, b) => a.set_no - b.set_no), nx = list.find((x) => x.seen < x.n);
  const sum = (f) => list.reduce((t, x) => t + (x[f] || 0), 0);
  return { total: sum("n"), seen: sum("seen"), due: vDue().length, mastered: sum("mastered"), next_set: nx ? nx.set_no : null, sets: list };
}
function vLabel(no) {
  const x = (V.sets || ((D && D.vocab && D.vocab.sets) || [])).find((y) => y.set_no === no);
  return (x && x.label) || "Set " + no;
}
function vMerge(words) {
  const have = new Set((V.words || []).map((w) => w.id));
  V.words = [...(V.words || []), ...words.filter((w) => !have.has(w.id))];
}
async function loadVocab() {
  if (V.loading) return;
  V.loading = true; renderQuiz();
  try { const d = await api({ action: "vocab" }); V.words = d.result.words || []; V.sets = d.result.sets || null; V.today = d.result.today; }
  catch (e) { toast("So'zlar yuklanmadi — internetni tekshiring"); }
  V.loading = false; renderQuiz();
}
function vSend(id, ok) {
  api({ action: "vocab_answer", id, ok }).then((d) => {
    const r = d.result, w = vById(id);
    if (r && r.ok && w) { w.seen = true; if (r.stage !== undefined) w.stage = r.stage; if (r.next) w.next_review = r.next; }
    $("vCnt").textContent = vsum().due;
  }).catch(() => toast("Saqlanmadi — internetni tekshiring"));
}
async function vStart(mode, setNo) {
  if (!V.words) return;
  if (mode === "learn" && !V.words.some((w) => w.set_no === setNo)) {
    toast("Yuklanmoqda…");
    try { const d = await api({ action: "vocab", sets: [setNo] }); vMerge(d.result.words || []); }
    catch (e) { toast("So'zlar yuklanmadi — internetni tekshiring"); return; }
  }
  let ids;
  if (mode === "learn") {
    const ws = V.words.filter((w) => w.set_no === setNo);
    const notKnown = ws.filter((w) => !(w.stage >= 1 && w.next_review > V.today));
    ids = (notKnown.length ? notKnown : ws).map((w) => w.id);
  } else ids = shuffle(vDue().map((w) => w.id));
  if (!ids.length) { toast("Hozir takrorlanadigan so'z yo'q"); return; }
  Object.assign(V, { mode, set: setNo || null, queue: ids, total: ids.length, passWrong: new Set() });
  vNextBatch(); haptic(); renderQuiz(); window.scrollTo({ top: 0 });
}
function vNextBatch() {
  Object.assign(V, { batch: V.queue.splice(0, V_BATCH), i: 0, res: {}, flipped: false, picked: null, view: "card" });
  if (V.mode === "review") V.batch.forEach((id, k) => { V.opts[id] = vMakeOpts(id, k % 3 === 2 ? "uz" : "en"); });
}
// 3 distractors, same part of speech when possible, never the same meaning twice
function vMakeOpts(id, dir) {
  const w = vById(id), key = (x) => (dir === "en" ? x.uz : x.word).toLowerCase();
  const others = shuffle(V.words.filter((x) => x.id !== id && key(x) !== key(w)));
  const pick = [], seenK = new Set([key(w)]);
  for (const x of [...others.filter((x) => x.pos === w.pos), ...others]) { if (pick.length >= 3) break; if (!seenK.has(key(x))) { seenK.add(key(x)); pick.push(x.id); } }
  return { dir, ids: shuffle([id, ...pick]) };
}
function vAnswer(ok) {
  const id = V.batch[V.i];
  if (V.res[id] !== undefined) return;
  V.res[id] = ok; if (!ok) V.passWrong.add(id);
  haptic(ok ? "ok" : "bad"); vSend(id, ok);
  if (V.mode === "learn") vAdvance();
  else renderVocab();
}
function vAdvance() {
  const k = V.batch.findIndex((id) => V.res[id] === undefined);
  V.flipped = false; V.picked = null;
  if (k >= 0) V.i = k; else V.view = "sum";
  renderVocab(); window.scrollTo({ top: 0 });
}
function vExit(msg) { V.mode = null; renderQuiz(); window.scrollTo({ top: 0 }); if (msg) toast(msg); }
function vContinue() {
  if (V.queue.length) { vNextBatch(); return renderVocab(); }
  if (V.passWrong.size) { V.queue = shuffle([...V.passWrong]); V.passWrong = new Set(); vNextBatch(); return renderVocab(); }
  vExit(V.mode === "learn" ? `${vLabel(V.set)} tugadi 🎉` : "Takror tugadi 🎉");
}

function renderVocab() {

    if (A !== undefined) h += `<div class="vq-res"><div class="vq-v">${esc(w.word)} — ${esc(w.uz)}</div>${w.more ? `<div>${esc(w.more)}</div>` : ""}

      <button class="btn dark big" style="margin-top:12px" id="vNext">${V.batch.some((x) => V.res[x] === undefined) ? "Keyingi" : "Natija"}</button>`;

  if ($("vNo")) $("vNo").onclick = () => vAnswer(false);

const V_BOOKS = { cp: "College Panda 400", sat: "SATashkent — real imtihon so'zlari", ivy: "Ivy Global 500", adv: "Advanced Package" };

/* ---------- MISTAKES ---------- */
function weakRows(d, limit) {
  const map = new Map();
  for (const m of d.mistakes) map.set(m.section + "|" + m.topic, { section: m.section, topic: m.topic, open: m.open, n: 0, ok: 0 });
  for (const q of d.quiz) { const k = q.section + "|" + q.topic, a = map.get(k) || { section: q.section, topic: q.topic, open: 0, n: 0, ok: 0 }; a.n = q.n; a.ok = q.ok; map.set(k, a); }
  return [...map.values()].map((r) => ({ ...r, acc: r.n ? r.ok / r.n : null, score: r.open * 2 + (r.n ? (1 - r.ok / r.n) * r.n : 0) }))
    .filter((r) => r.open > 0 || (r.acc !== null && r.acc < 1)).sort((a, b) => b.score - a.score).slice(0, limit);
}

/* ---------- SAT MAP ---------- */
// rough count of wrong answers a score implies (used to tell whether a test's mistakes are fully entered)
const expectedWrong = (x) => x.math && x.rw ? Math.round((800 - x.math) / PTS.math + (800 - x.rw) / PTS.rw) : Math.round((1600 - x.total) / 12.3);
const testComplete = (x) => x.wrong_total > 0 && x.wrong_total >= 0.6 * expectedWrong(x);
function domainRows(d) {
  const lt = (d.tests || []).find(testComplete); // latest test whose mistakes are (mostly) entered
  return { lt, rows: Object.keys(DOM).map((k) => {
    const st = (d.domains || {})[k] || { n: 0, ok: 0, open: 0, total: 0 }, dm = DOM[k];
    const qAcc = st.n ? st.ok / st.n : null, tw = lt ? Math.min(dm.q, lt.wrong[k] || 0) : null;
    const acc = lt ? 1 - tw / dm.q : st.n >= 2 ? qAcc : null;
    const expW = lt ? tw : st.n >= 3 ? dm.q * (1 - qAcc) : null;
    const gain = expW === null ? null : Math.round((expW / 2) * PTS[dm.s] / 10) * 10;
    return { k, dm, st, acc, tw, gain };
  }) };
}
const barCol = (a) => a === null ? C.rest : a >= 75 ? C.limeSoft : a >= 50 ? C.amber : C.coral;
const brow = (name, sub, pct) => `<div class="brow"><div class="brow-top"><span>${esc(name)}</span><b>${pct === null ? "—" : pct + "%"}</b></div>
  ${sub ? `<div class="brow-s">${esc(sub)}</div>` : ""}<div class="mini"><i style="width:${pct ?? 0}%;background:${barCol(pct)}"></i></div></div>`;

function renderMap() {
  const d = D, { lt, rows } = domainRows(d);
  $("mapHint").textContent = lt ? `${lt.name || "test"}: ${lt.total}` : "";
  const newest = (d.tests || [])[0], partial = newest && newest !== lt && !testComplete(newest);
  $("mapLead").textContent = lt ? "Oxirgi test xatolari asosida, taxminiy." : "Test xatolari kiritilgach aniq bo'ladi.";
  if (partial) $("mapLead").textContent += ` Oxirgi testdan ${newest.wrong_total} / ~${expectedWrong(newest)} xato kiritilgan.`;
  const best = rows.filter((r) => r.gain >= 10).sort((a, b) => b.gain - a.gain)[0];
  $("oppBox").innerHTML = best ? `<div class="opp">Eng katta imkoniyat: <b>${esc(best.dm.n)}</b> — xatolarni yarmiga tushirsangiz ≈ <b>+${best.gain} ball</b>.</div>` : "";
  const grp = (s, title) => `<div class="grp">${title}</div>` + rows.filter((r) => r.dm.s === s).map((r) => {
    const a = r.acc === null ? null : Math.round(r.acc * 100);
    const sub = r.tw !== null ? `testda ${r.tw} xato` : r.st.n ? `${r.st.ok} / ${r.st.n} savol` : "";
    return brow(r.dm.n, sub, a);
  }).join("");
  $("satMap").innerHTML = grp("math", "Math") + grp("rw", "Reading and Writing");

  const ts = d.tests || [];
  $("testList").innerHTML = ts.length ? ts.map((x) => `<div class="row"><div class="txt"><div class="t">${esc(x.name || "Test")}: ${x.total}</div>
    <div class="s">${fmt(x.day)}, ${x.wrong_total} / ~${expectedWrong(x)} xato kiritilgan</div></div>
    <button class="btn ghost" data-testm="${x.id}">+ Xato</button></div>`).join("")
    : `<p class="lead" style="margin:6px 2px 0">Hali test yo'q. Asosiy sahifadagi <b>Practice test</b> orqali kiriting.</p>`;
}

function renderStats() {
  const d = D, balls = d.balls;
  $("sSub").textContent = d.sat_days > 0 ? `SAT'gacha ${d.sat_days} kun` : "";

  // score: current number, next milestone, chart once there is a score, planned path as chips
  const last = balls.length ? balls[balls.length - 1].value : null, first = balls.length ? balls[0].value : null;
  const next = MILESTONES.find((m) => t(m[0]) >= t(d.today) && (!last || m[1] > last));
  $("scoreNow").textContent = last ?? "";
  $("scoreNow").hidden = !last;

    last >= d.target ? "Maqsadga yetdingiz. Endi ushlab turing." : `1300 gacha <b>${d.target - last}</b> ball${next ? `<br>Keyingi: ${fmt(next[0])} — ${next[1]}` : ""}`;
  $("ballHint").textContent = balls.length > 1 ? `${last - first >= 0 ? "+" : ""}${last - first}` : "";
  if (balls.length > 1) {

    const lo = Math.max(400, Math.floor((Math.min(...vals) - 50) / 100) * 100), step = 1400 - lo > 600 ? 200 : 100;
    const ticks = []; for (let v = 1400; v >= lo; v -= step) ticks.unshift(v);
    lineChart($("ballChart"), { start: "2026-10-17", end: "2026-12-06", ymin: ticks[0], ymax: 1400, ticks, h: 170, hlines: [{ v: d.target, color: C.lime }],
      series: [{ id: "p", points: MILESTONES, color: C.plan, dash: "5 5", width: 2 }, { id: "b", points: balls.map((b) => [b.day, b.value]), color: C.ink, dots: true, labels: true, area: true }] });
  } else $("ballChart").innerHTML = "";
  $("ballMiles").innerHTML = MILESTONES.map((m) => `<span class="${last && last >= m[1] ? "hit" : ""}"><b>${fmt(m[0])}</b>${m[1]}</span>`).join("");

  renderMap();

  // weak topics
  const rows = weakRows(d, 5);
  $("weak").innerHTML = rows.length ? rows.map((r) => {
    const a = r.acc === null ? null : Math.round(r.acc * 100);
    const sub = [r.section === "math" ? "Math" : "R&W", r.open ? `${r.open} ta ochiq xato` : "", r.n ? `${r.ok} / ${r.n} savol` : ""].filter(Boolean).join(", ");
    return brow(r.topic, sub, a);
  }).join("") : `<p class="lead" style="margin:6px 2px 0">Hozircha yo'q. Xato va savollardan keyin shu yerda chiqadi.</p>`;

  // discipline: 21-day bars + 7-day accuracy
  const recent = d.days.filter((x) => t(x.day) > t(d.today) - 21 * DAY);
  if (recent.length) {
    const w = 340, h = 110, L = 0, B = 18, T = 4, n = 21, bw = (w - L) / n, y = (p) => T + (1 - p) * (h - T - B);
    let s = `<svg class="chart" viewBox="0 0 ${w} ${h}">`;
    s += `<line x1="${L}" x2="${w}" y1="${y(.75)}" y2="${y(.75)}" stroke="${C.lime}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    for (let i = 0; i < n; i++) {
      const day = new Date(t(d.today) - (n - 1 - i) * DAY).toISOString().slice(0, 10), r = recent.find((x) => x.day === day);
      const xx = L + i * bw + 2, bwid = bw - 5;
      if (i % 5 === 0 || i === n - 1) s += `<text x="${xx + bwid / 2}" y="${h - 3}" text-anchor="middle">${fmt(day)}</text>`;
      s += `<rect x="${xx}" y="${y(1)}" width="${bwid}" height="${y(0) - y(1)}" rx="${bwid / 2}" fill="${C.grid}"/>`;
      if (!r || r.rest || !r.total) continue;
      const p = r.done / r.total, hh = Math.max(bwid, y(0) - y(p));
      s += `<rect x="${xx}" y="${y(0) - hh}" width="${bwid}" height="${hh}" rx="${bwid / 2}" fill="${barCol(Math.round(p * 100))}"/>`;
    }
    $("doneChart").innerHTML = s + "</svg>";
    const actv = recent.filter((x) => !x.rest && x.total), good = actv.filter((x) => x.done / x.total >= .75).length;
    $("doneLead").textContent = `${actv.length} kundan ${good} tasida bloklarning 75% i bajarildi.`;
  } else { $("doneChart").innerHTML = ""; $("doneLead").textContent = "Birinchi kun tugagach shu yerda ko'rinadi."; }
  const w7 = d.work.filter((x) => t(x.day) > t(d.today) - 7 * DAY);
  const sum = (k) => w7.reduce((a, x) => a + Number(x[k] || 0), 0);
  $("accRow").hidden = !w7.length;
  $("accRow").innerHTML = w7.length ? `<div><b>${sum("math_done") ? Math.round((100 * sum("math_ok")) / sum("math_done")) + "%" : "—"}</b><span>Math aniqligi, 7 kun</span></div>

}

    $("tmAdd").disabled = true;
    const r = await act({ action: "mistake_add", section: sec, domain: TM.dom, topic: $("tm_t").value.trim() || DOM[TM.dom].n,
      reason: TM.reason, test_id: TM.id, qnum }, `Qo'shildi: ${qnum}`);
    if (r) { TM.dom = null; TM.reason = null; }
    renderTestM();
    if (r) $("tm_n").focus();
  };
}

/* ---------- spaced review of old mistakes ---------- */
function renderReview() {
  const b = $("sheetBody"), m = RV.list[RV.i], steps = (D.review_stats || {}).steps || 4;
  if (!RV.list.length) {
    b.innerHTML = `<h3>Takror</h3>${emptyBox(ICON.check, "Bugun takrorlanadigan xato yo'q. Yangi xatolar ertasi kuni shu yerda chiqadi.")}${foot(`<button class="btn dark big" id="rvClose">Yopish</button>`)}`;
    $("rvClose").onclick = closeSheet; return;
  }
  if (!m) {
    b.innerHTML = `<h3>Takror tugadi</h3><p class="lead">${RV.list.length} tadan ${RV.ok} tasini esladingiz.</p>
      ${emptyBox(ICON.check, RV.ok === RV.list.length ? "Hammasi esda. Ular keyingi muddatga surildi." : "Unutganlaringiz ertaga yana chiqadi — shunda mustahkamlanadi.")}
      ${foot(`<button class="btn dark big" id="rvClose">Yopish</button>`)}`;
    $("rvClose").onclick = closeSheet; return;
  }
  const dm = m.domain && DOM[m.domain];
  const note = m.note && !String(m.note).startsWith("Savol: ") ? m.note : null;
  let h = `<div class="card-h" style="margin-right:44px"><h3 style="margin:4px 0">Takror ${RV.i + 1} / ${RV.list.length}</h3><span class="hint">${m.review_stage || 0} / ${steps} bosqich</span></div>
    <div class="q-meta" style="margin-top:10px"><span class="tag soft">${m.section === "math" ? "Math" : "R&amp;W"}</span>${dm ? `<span class="tag soft">${esc(dm.n)}</span>` : ""}${m.qnum ? `<span class="tag soft">${esc(m.qnum)}</span>` : ""}<span class="tag soft">${fmt(m.day)}</span></div>
    <div class="rv-topic">${esc(m.topic)}</div>`;
  if (m.quiz) {
    const A = RV.picked, right = m.quiz.answer;
    h += `<p class="q-text">${esc(m.question || "")}</p>` + m.quiz.options.map((o, i) => {
      const cls = A !== null ? (i === right ? "right" : i === A ? "wrong" : "") : "";
      return `<button class="opt ${A !== null ? "locked" : ""} ${cls}" data-rv="${i}"><span class="L">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
    }).join("");
    if (A !== null) h += `<div class="explain ${A === right ? "ok" : "bad"}"><b>${A === right ? "Esladingiz. " : "Hali o'zlashmagan. "}</b>${esc(m.quiz.explain || "")}</div>
      ${foot(`<button class="btn dark big" id="rvNext">Keyingisi</button>`)}`;
  } else {
    h += m.question ? `<p class="q-text">${esc(m.question)}</p>` : `<p class="lead">Savol matni yozilmagan. Eslang: bu mavzuda nima qilish kerak edi?</p>`;
    if (!RV.shown) h += `<p class="lead">Avval o'zingiz yeching yoki eslang, keyin javobni oching.</p>${foot(`<button class="btn dark big" id="rvShow">Javobni ko'rsatish</button>`)}`;
    else h += (m.my_answer || m.right_answer ? `<div class="ans"><div><span>Siz</span><b>${esc(m.my_answer || "—")}</b></div><div><span>To'g'ri</span><b>${esc(m.right_answer || "—")}</b></div></div>` : "")
      + (note ? `<div class="note-box">${esc(note)}</div>` : "")
      + (m.reason ? `<p class="lead" style="margin-top:10px">Sabab: <b>${esc(REASON[m.reason] || m.reason)}</b></p>` : "")
      + foot(`<div class="grid2"><button class="btn soft big" id="rvNo">Unutibman</button><button class="btn lime big" id="rvYes">Eslayman</button></div>`);
  }
  b.innerHTML = h;
  const send = (remembered) => api({ action: "review", id: m.id, remembered }).then((d) => { D = d; renderAll(); }).catch(() => toast("Saqlanmadi — internetni tekshiring"));
  const next = () => { RV.i++; RV.shown = false; RV.picked = null; renderReview(); $("sheet").scrollTop = 0; };
  b.querySelectorAll("[data-rv]").forEach((x) => x.onclick = () => {
    if (RV.picked !== null) return;
    RV.picked = +x.dataset.rv; const ok = RV.picked === m.quiz.answer; if (ok) RV.ok++;
    haptic(ok ? "ok" : "bad"); send(ok); renderReview();
  });
  if ($("rvNext")) $("rvNext").onclick = next;
  if ($("rvShow")) $("rvShow").onclick = () => { RV.shown = true; haptic(); renderReview(); };
  if ($("rvYes")) $("rvYes").onclick = () => { RV.ok++; haptic("ok"); send(true); next(); };
  if ($("rvNo")) $("rvNo").onclick = () => { haptic("bad"); send(false); next(); };
}

function closeSheet() {
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
  if (document.activeElement) document.activeElement.blur();
  if (tg.BackButton && VIEW === "v-home") tg.BackButton.hide();
}

/* ---------- navigation ---------- */
function go(v) {
  VIEW = v;
  document.querySelectorAll(".view").forEach((x) => x.classList.toggle("on", x.id === v));
  document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo({ top: 0 });
  if (v === "v-quiz") { if (Q.section === "vocab") renderQuiz(); else if (!Q.cur && !Q.loading) loadQuiz(); }
  if (tg.BackButton) v === "v-home" ? tg.BackButton.hide() : tg.BackButton.show();
  haptic();
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("button");
  if (!el || el.closest("#sheet")) return; // sheet buttons have their own handlers
  if (el.dataset.v) return go(el.dataset.v);
  if (el.dataset.vocab) { Q.section = "vocab"; V.mode = null; }
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.sheet) return openSheet(el.dataset.sheet);
  if (el.dataset.testm) return openSheet("testm", +el.dataset.testm);
  if (el.dataset.mark) {
    const key = el.dataset.mark;
    el.disabled = true; el.textContent = "…";
    const r = await act({ action: "mark", key, status: "done" });
    if (!r) return;
    if (r.status === "late") { toast("05:15 o'tdi — bugun streak hisoblanmaydi"); haptic("bad"); }
    else toast(key === WAKE ? "Xayrli tong! ☀️" : "Blok boshlandi");
    if (VOCAB_KEYS.includes(key)) { Q.section = "vocab"; V.mode = null; go("v-quiz"); }
    return;
  }
  if (el.dataset.resolve) { el.disabled = true; openMx = null; return act({ action: "mistake_resolve", id: el.dataset.resolve }, "Xato yopildi"); }
  if (el.dataset.mx) { const id = +el.dataset.mx; openMx = openMx === id ? null : id; haptic(); return renderBook(); }
  if (el.dataset.opt !== undefined) return answerQuiz(+el.dataset.opt);
  if (el.id === "qNext") return loadQuiz();
  if (el.id === "tlMore") { tlOpen = !tlOpen; haptic(); return renderTimeline(); }
  if (el.closest("#qSeg") && el.dataset.s) {
    if (Q.section !== el.dataset.s) { Q.section = el.dataset.s; haptic(); if (Q.section === "vocab") { V.mode = null; renderQuiz(); } else loadQuiz(); }
    return;
  }
  if (el.closest("#bSeg") && el.dataset.s) { bookFilter = el.dataset.s; renderBook(); haptic(); }
});
$("scrim").addEventListener("click", closeSheet);
$("shX").addEventListener("click", closeSheet);
$("themeBtn").addEventListener("click", toggleTheme);

/* ---------- home screen shortcut (Telegram 8.0+) ---------- */
function setupHomeScreen() {
  // shown only while it can actually help: supported and not yet added
  const card = $("hsCard");
  const ok = ["ios", "android", "android_x"].includes(tg.platform) && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && typeof tg.addToHomeScreen === "function";
  if (!ok) return;
  $("hsBtn").onclick = () => { haptic(); try { tg.addToHomeScreen(); } catch (e) {} };
  tg.onEvent("homeScreenAdded", () => { card.hidden = true; toast("Bosh ekranga qo'shildi"); haptic("ok"); });
  try { tg.checkHomeScreenStatus((st) => { card.hidden = st !== "missed"; }); } catch (e) {}
}

async function main() {
  if (!tg || !tg.initData) { $("msg").innerHTML = `<div class="err">Bu panel faqat Telegram bot ichida ochiladi.<br>Botda <b>/panel</b> deb yozing.</div>`; return; }
  tg.ready(); tg.expand();
  applyTheme();
  try {
    const mobile = ["ios", "android", "android_x"].includes(tg.platform);
    if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && !tg.isFullscreen) tg.requestFullscreen();
    if (tg.isVersionAtLeast && tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes();
  } catch (e) {}
  if (tg.BackButton) tg.BackButton.onClick(() => { if ($("sheet").classList.contains("on")) closeSheet(); else if (VIEW === "v-quiz" && Q.section === "vocab" && V.mode) vExit(); else go("v-home"); });
  if (tg.onEvent) {
    tg.onEvent("activated", refresh); // back to the panel: fresh numbers
  }
  try {
    D = await api();
    $("msg").hidden = true; $("app").hidden = false; $("nav").hidden = false;
    renderAll();
    setupHomeScreen();
  } catch (e) {
    $("msg").innerHTML = `<div class="err">${e.message === "forbidden" ? "Bu panel faqat bot egasi uchun." : "Ma'lumot yuklanmadi. Internetni tekshirib, panelni qayta oching."}</div>`;
  }
}
main();
</script>
